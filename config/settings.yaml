# 키워드 조사·상품명 생성 기준값. 숫자만 바꿔가며 조정하면 됩니다.

keyword_research:
  min_volume: 30            # 월간 검색수(PC+모바일)가 이보다 적은 키워드는 버림
  max_candidates: 60        # 품목당 쇼핑 검색으로 경쟁도를 확인할 키워드 수 (검색수 상위부터)
  sample_size: 40           # 카테고리 일치율 계산에 쓰는 쇼핑 검색 상위 상품 수
  category_depth: 3         # 카테고리 비교 깊이 (1=대분류, 2=중분류, 3=소분류, 4=세분류)
  min_category_match: 0.5   # 상위 상품 중 이 비율 이상이 같은 카테고리여야 '관련 키워드'로 인정
  main_candidates: 3        # 품목당 '메인' 키워드 후보 수

title:
  recommended_length: 50    # 네이버 쇼핑 권장 상품명 길이 (공백 포함)
  max_length: 100           # 스마트스토어 상품명 최대 길이
  max_modifiers: 3          # 상품명에 넣을 속성어(접이식, 경량 등) 최대 개수
  max_tags: 10              # 스마트스토어 검색 태그 최대 개수

  # 상품 정보에 없어도 복지용구라면 항상 사실인 수식어
  always_true_modifiers: [노인, 어르신, 실버, 노인용, 성인용, 환자용, 복지용구, 장기요양]

  # 검색 의도를 나타낼 뿐 상품 속성이 아닌 말. 이 말이 들어간 키워드는 상품명·태그에 넣지 않음
  intent_words: [추천, 가격, 후기, 순위, 파는곳, 구매, 구입, 대여, 렌탈, 임대, 중고, 종류, 브랜드, 최저가, 비교, 사용법, 신청, 지원]

cache:
  ttl_days: 14              # 네이버 API 응답 재사용 기간 (같은 키워드 반복 조회 방지)

# ---------------------------------------------------------------- 2단계: 상세페이지

claude:
  # 자료 분석·기획·카피·리뷰 분석·레퍼런스 분석·이미지 프롬프트를 맡습니다.
  backend: cli                           # cli = 터미널의 Claude Code (구독 로그인, API 키 불필요) / api = Anthropic API 키
  model: claude-opus-5-5
  effort: high                           # low | medium | high | xhigh | max — 높을수록 꼼꼼하지만 느리고 사용량이 많음
  cli_path: ""                           # 비워두면 터미널의 'claude' 명령을 씀
  cli_timeout_minutes: 20                # 두꺼운 카탈로그는 읽는 데 오래 걸릴 수 있음

gemini:
  # 이미지 생성만 맡습니다. 모델 이름은 구글이 자주 바꾸니 화면의 '사용 가능한 모델 확인'으로 확인해 고치세요.
  image_model: gemini-nano-banana-2.1    # 연출 컷·배경 편집 (Nano Banana). 고품질: gemini-3-pro-image
  max_reference_photos: 3                # 이미지 생성 때 함께 넣는 실사진 수 (제품 모양 유지용)
  max_generated_images: 6                # 상품당 AI 생성 이미지 최대 수 (비용 관리)

detail:
  base_width: 860                        # 디자인 기준 폭
  platforms:
    smartstore: {label: 스마트스토어, width: 860, thumbnail: 1000}
    coupang: {label: 쿠팡, width: 780, thumbnail: 1000}
    toss: {label: 토스쇼핑, width: 1080, thumbnail: 1000}
  formats: [jpg, png, webp]
  jpg_quality: 90
  aspect_ratios:                         # 섹션 종류별 AI 이미지 비율
    hero: "4:5"
    default: "4:3"
