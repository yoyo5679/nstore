# 마스터 시트 → 스마트스토어 상품 일괄등록 양식 매핑
#
# columns: 왼쪽은 스마트스토어 양식의 헤더 이름, 오른쪽은 마스터 시트 컬럼 이름.
#          양식 헤더는 띄어쓰기·별표(*)·'(필수)'를 무시하고 비교합니다.
# fixed  : 모든 상품에 같은 값을 넣을 칸.
# skip_rows_after_header: 양식에서 헤더 아래 예시·설명 행이 있으면 그 행 수.
#
# 주의: 스마트스토어 일괄등록 양식은 네이버가 수시로 바꿉니다.
#       스마트스토어센터에서 최신 양식을 받아 templates/ 폴더에 넣고,
#       출력 결과의 '못 찾은 컬럼' 경고를 보고 아래 헤더 이름을 맞춰주세요.

columns:
  판매자상품코드: 자사몰상품코드
  카테고리코드: 카테고리ID
  상품명: 최종상품명
  판매가: 판매가
  재고수량: 재고
  대표이미지: 대표이미지
  추가이미지: 추가이미지
  브랜드: 브랜드
  제조사: 제조사
  모델명: 모델명
  원산지: 원산지
  태그: 최종태그

fixed:
  상품상태: 신상품

skip_rows_after_header: 0
