# 상품명·태그 검사 규칙
#
# error   : 넣으면 안 되는 말 (네이버 어뷰징 감점 또는 법 위반 위험)
# warning : 넣어도 되지만 사람이 한 번 확인해야 하는 말
#
# 출처: 네이버 쇼핑 상품명 가이드(판매조건·홍보문구·특수문자 지양),
#       의료기기법 제24조(거짓·과장 광고 금지), 장기요양 본인부담금 면제·할인 유인 금지

error_phrases:
  # 판매조건·홍보문구 — 상품명에는 상품 정보만
  - 무료배송
  - 당일발송
  - 당일배송
  - 최저가
  - 특가
  - 핫딜
  - 할인
  - 세일
  - 이벤트
  - 사은품
  - 증정
  - 1+1
  - 2+1
  - 쿠폰
  # 장기요양 본인부담금 면제·할인 유인
  - 본인부담금면제
  - 본인부담금할인
  - 본인부담면제
  - 본인부담할인
  - 공짜
  - 본인부담0원
  - 본인부담금0원

warning_phrases:
  # 의료기기 광고에서 문제 되기 쉬운 효능·최상급 표현
  - 치료
  - 완치
  - 특효
  - 효과
  - 부작용
  - 최고
  - 최초
  - 1위
  - 일등
  - 보장
  - 의사추천
  - 식약처인증
  # 판매조건으로 읽힐 수 있음
  - 본인부담
  - 정부지원

# 이 문자 말고 다른 특수문자가 들어가면 경고 (한글·영문·숫자·공백은 항상 허용)
allowed_symbols: "-/.,()&%"
